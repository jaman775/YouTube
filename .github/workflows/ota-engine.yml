name: Publish engine update

# Every day: take the newest NewPipe Extractor release, build the engine, sign it and publish it as
# the "ota" release. Apps that were built with this repository's manifest URL and public key pick it up
# on their own. One-time setup is described in OTA.md.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install tools
        run: |
          pip install cryptography
          SDKM="$(command -v sdkmanager || ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "build-tools;35.0.0" "platforms;android-35"

      - name: Use the newest NewPipe Extractor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/TeamNewPipe/NewPipeExtractor/releases/latest --jq .tag_name)
          echo "Newest NewPipe Extractor: $latest"
          sed -i "s/^newpipe = \".*\"/newpipe = \"$latest\"/" gradle/libs.versions.toml

      - name: Is there anything new to publish?
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p prev
          gh release download ota --repo "$REPO" --pattern manifest.json --dir prev 2>/dev/null || true
          version="NewPipe Extractor $(sed -n 's/^newpipe = "\(.*\)"/\1/p' gradle/libs.versions.toml)"
          (cd tools/potoken && npm ci --silent && npm run --silent build)
          python3 - "$version" <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib, json, sys
          from pathlib import Path
          version = sys.argv[1]
          sha = lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          now = {"potoken.html": sha("tools/potoken/dist/potoken.html"), "inject.js": sha("app/src/main/assets/browser/inject.js")}
          try:
              old = json.loads(Path("prev/manifest.json").read_text())
              same = old["engine"]["version"] == version and {a["name"]: a["sha256"] for a in old["assets"]} == now
          except Exception:
              same = False
          print("publish=" + ("false" if same else "true"))
          PY

      - name: Build and sign
        if: steps.changed.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GRADLE: gradle
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          printf '%s\n' "$OTA_SIGNING_KEY" > "$RUNNER_TEMP/ota.pem"
          # Ten-minute ticks since 2026-01-01: always increasing and well inside a 32-bit integer.
          seq=$(( ($(date +%s) - 1767225600) / 600 ))
          ANDROID_HOME="$ANDROID_HOME" OTA_KEY="$RUNNER_TEMP/ota.pem" tools/build-ota.sh "$seq" ota-out
          rm -f "$RUNNER_TEMP/ota.pem"

      - name: Publish
        if: steps.changed.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ota >/dev/null 2>&1 || gh release create ota --title "Engine updates" \
            --notes "Signed engine updates for Drishyopot. Not an app release." --latest=false
          gh release upload ota ota-out/* --clobber
