name: Build APK

# Builds an installable APK on every push, pull request, or by hand (Actions -> Build APK -> Run workflow).
# Pushing a tag such as v0.1.0 also publishes the APK as a GitHub Release.
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform
        run: |
          SDKM="$(command -v sdkmanager || ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Debug APK: always works, signed with the debug key, installs directly.
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"

      - uses: actions/upload-artifact@v4
        with:
          name: Drishyopot-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Release APK (smaller, minified): only when you have added the signing secrets, see README.
      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks" \
            gradle :app:assembleRelease --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload release APK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Drishyopot-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null || ls app/build/outputs/apk/debug/*.apk)
          gh release create "${GITHUB_REF_NAME}" $files --title "${GITHUB_REF_NAME}" --generate-notes

  # Unit tests run separately so a failing test never blocks the APK.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Install Android platform
        run: |
          SDKM="$(command -v sdkmanager || ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: gradle testDebugUnitTest --stacktrace
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: cd tools/page-script && npm ci && npm test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
